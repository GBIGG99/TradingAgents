# Streamlit Cloud (and any `streamlit run`) reads this automatically.
# enableStaticServing exposes chat_agent/static/* at /app/static/* so the
# PWA manifest, icons, and service worker are reachable by the browser.
[server]
enableStaticServing = true

[theme]
base = "dark"
primaryColor = "#4ADE80"
backgroundColor = "#0E1117"
